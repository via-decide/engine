<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>VIA Decide — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  /* Colors */
  --bg:         #0d0d0f;
  --surface:    #111116;
  --surface2:   #18181f;
  --surface3:   #1f1f28;
  --border:     #27272f;
  --border2:    #1e1e26;
  --orange:     #ff6b2b;
  --orange2:    #e85a1e;
  --orange-dim: rgba(255,107,43,0.13);
  --orange-glow:rgba(255,107,43,0.25);
  --text:       #eeeef5;
  --text2:      #c0c0d0;
  --muted:      #52526a;
  --muted2:     #7878a0;
  --red:        #ff4444;
  --green:      #3ddc97;
  --yellow:     #f0c040;

  /* Typography — fluid scale */
  --font-d: 'Syne', sans-serif;
  --font-m: 'DM Mono', monospace;
  --text-xs:   clamp(0.6rem,  1.2vw, 0.72rem);
  --text-sm:   clamp(0.72rem, 1.4vw, 0.85rem);
  --text-base: clamp(0.85rem, 1.6vw, 1rem);
  --text-lg:   clamp(1rem,    2vw,   1.25rem);
  --text-xl:   clamp(1.2rem,  2.5vw, 1.6rem);
  --text-2xl:  clamp(1.5rem,  3.5vw, 2.2rem);

  /* Layout */
  --header-h:    56px;
  --sidebar-w:   240px;
  --right-w:     190px;
  --nav-h:       60px; /* mobile bottom nav */
  --radius:      6px;
  --radius-lg:   10px;

  /* Motion */
  --ease:  0.16s ease;
  --ease2: 0.28s cubic-bezier(0.4,0,0.2,1);
}

/* Larger hit targets & spacing on big screens */
@media (min-width: 1600px) {
  :root {
    --header-h:  64px;
    --sidebar-w: 280px;
    --right-w:   220px;
  }
}
/* TV / large display */
@media (min-width: 2400px) {
  :root {
    --header-h:  80px;
    --sidebar-w: 340px;
    --right-w:   280px;
    --text-xs:   0.9rem;
    --text-sm:   1.05rem;
    --text-base: 1.2rem;
    --text-lg:   1.5rem;
    --text-xl:   2rem;
    --text-2xl:  2.8rem;
  }
}

html { height: 100%; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-d);
  font-size: var(--text-base);
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════════════
   SCROLLBARS
═══════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ═══════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════ */
#header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: rgba(17,17,22,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 clamp(0.75rem, 2vw, 1.5rem);
  gap: clamp(0.4rem, 1vw, 0.85rem);
  z-index: 500;
}

/* Logo */
.h-logo {
  display: flex; align-items: center; gap: 0.15em;
  font-size: clamp(1rem, 2vw, 1.25rem);
  font-weight: 800; letter-spacing: -0.04em;
  color: var(--text); text-decoration: none;
  white-space: nowrap; flex-shrink: 0;
  transition: opacity var(--ease);
}
.h-logo:hover { opacity: 0.8; }
.h-logo span { color: var(--orange); }
.h-logo-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--orange);
  margin-left: 0.3em;
  flex-shrink: 0;
  animation: pulse-dot 2.5s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.4; transform:scale(0.7); }
}

/* Divider */
.h-div {
  width: 1px; height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* Mode tabs */
.h-modes { display: flex; gap: 2px; flex-shrink: 0; }
.mode-tab {
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.08em; font-weight: 400;
  padding: 0.35em 0.85em;
  border: 1px solid var(--border);
  background: transparent; color: var(--muted2);
  cursor: pointer; border-radius: 4px;
  transition: var(--ease); white-space: nowrap;
  line-height: 1.4;
}
.mode-tab.active {
  background: var(--orange-dim);
  border-color: var(--orange); color: var(--orange);
}
.mode-tab:hover:not(.active) { background: var(--surface3); color: var(--text); }

.h-spacer { flex: 1; min-width: 0; }

/* Search */
.h-search {
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.4em 0.75em;
  transition: border-color var(--ease);
  min-width: 0;
}
.h-search:focus-within { border-color: var(--orange); }
.h-search-icon { color: var(--muted); font-size: 0.9rem; flex-shrink: 0; }
.h-search input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font-m);
  font-size: var(--text-xs); width: clamp(80px, 12vw, 180px);
  min-width: 0;
}
.h-search input::placeholder { color: var(--muted); }

/* YouTube button */
.btn-yt {
  display: inline-flex; align-items: center; gap: 0.45em;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted2); font-family: var(--font-m);
  font-size: var(--text-xs); letter-spacing: 0.05em;
  padding: 0.4em 0.9em; cursor: pointer;
  text-decoration: none; border-radius: var(--radius);
  white-space: nowrap; transition: var(--ease); flex-shrink: 0;
}
.btn-yt:hover { border-color: var(--red); color: var(--red); background: rgba(255,68,68,0.06); }
.btn-yt-icon { color: var(--red); font-size: 0.7rem; }

/* Home back button */
.btn-home {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted2); text-decoration: none;
  padding: 0.4em 0.75em; border: 1px solid var(--border);
  border-radius: var(--radius); transition: var(--ease);
  flex-shrink: 0; white-space: nowrap;
}
.btn-home:hover { color: var(--text); border-color: var(--muted2); }

/* Hamburger — shown only on mobile */
.btn-ham {
  display: none;
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.45em 0.65em;
  color: var(--muted2); cursor: pointer; flex-shrink: 0;
  transition: var(--ease); line-height: 1;
}
.btn-ham:hover { color: var(--text); border-color: var(--muted2); }
.btn-ham svg { display: block; width: 18px; height: 18px; }

/* ═══════════════════════════════════════════════════════════
   LAYOUT SHELL  —  3 columns on desktop
═══════════════════════════════════════════════════════════ */
#shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--right-w);
  grid-template-rows: 1fr;
  height: 100vh;
  padding-top: var(--header-h);
}

/* ─────────────────────────────────────────────
   LEFT SIDEBAR
───────────────────────────────────────────── */
#sidebar-left {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}

.sb-head {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0.75rem 0.85rem 0.6rem;
}
.sb-head-label {
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.18em; color: var(--muted);
}
.sb-head-action {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--orange); cursor: pointer; line-height: 1;
  background: none; border: none; padding: 0.15rem 0.25rem;
  border-radius: 3px; transition: var(--ease);
}
.sb-head-action:hover { background: var(--orange-dim); }

.sb-body { padding: 0.5rem 0.6rem 1rem; }

/* Category */
.cat-wrap { margin-bottom: 2px; }
.cat-head {
  display: flex; align-items: center; gap: 0.5rem;
  padding: clamp(0.5rem, 1.2vw, 0.6rem) 0.6rem;
  cursor: pointer; border-radius: var(--radius);
  transition: background var(--ease);
  user-select: none; -webkit-user-select: none;
  min-height: 44px; /* accessible touch target */
}
.cat-head:hover { background: var(--surface2); }
.cat-head:active { background: var(--surface3); }
.cat-emoji { font-size: 1rem; flex-shrink: 0; line-height: 1; }
.cat-name {
  flex: 1; font-size: var(--text-sm); font-weight: 600;
  color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cat-count {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted); background: var(--surface3);
  border-radius: 99px; padding: 0.1em 0.55em;
  flex-shrink: 0;
}
.cat-chevron {
  flex-shrink: 0; width: 14px; height: 14px;
  color: var(--muted); transition: transform 0.22s ease;
}
.cat-chevron.open { transform: rotate(90deg); }

.cat-items {
  overflow: hidden; max-height: 0;
  transition: max-height 0.26s cubic-bezier(0.4,0,0.2,1);
}
.cat-items.open { max-height: 800px; }

.prod-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: clamp(0.45rem,1vw,0.55rem) 0.6rem clamp(0.45rem,1vw,0.55rem) 1.1rem;
  border-radius: var(--radius); cursor: pointer;
  color: var(--muted2); transition: var(--ease);
  min-height: 40px;
}
.prod-item:hover { background: var(--surface2); color: var(--text); }
.prod-item:active { background: var(--surface3); }
.prod-item.active { background: var(--orange-dim); color: var(--orange); }
.prod-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; flex-shrink: 0; opacity: 0.7;
}
.prod-name { font-size: var(--text-sm); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─────────────────────────────────────────────
   MAIN AREA
───────────────────────────────────────────── */
#main-wrap { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* Tab nav */
#tab-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(0.6rem, 1.5vw, 1rem);
  display: flex; gap: 0;
  flex-shrink: 0; overflow-x: auto; overflow-y: hidden;
}
#tab-nav::-webkit-scrollbar { height: 2px; }

.page-tab {
  display: inline-flex; align-items: center; gap: 0.4em;
  font-size: var(--text-sm);
  padding: 0 clamp(0.6rem, 1.5vw, 1rem);
  height: 46px;
  border: none; border-bottom: 2px solid transparent;
  border-radius: 0;
  background: transparent; color: var(--muted2);
  cursor: pointer; transition: var(--ease);
  white-space: nowrap; flex-shrink: 0;
  position: relative;
}
.page-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.page-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
.tab-ic { font-size: 0.85em; opacity: 0.8; }

/* Main content area */
#main-content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: clamp(1rem, 2.5vw, 2rem) clamp(0.85rem, 2.5vw, 2rem);
  scroll-behavior: smooth;
}

/* Page-in animation */
.page-enter {
  animation: pageEnter 0.22s ease both;
}
@keyframes pageEnter {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ─────────────────────────────────────────────
   RIGHT SIDEBAR — LEGAL
───────────────────────────────────────────── */
#sidebar-right {
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
}
.rs-head {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  padding: 0.75rem 0.85rem 0.6rem;
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.18em; color: var(--muted);
}

.legal-item {
  display: flex; align-items: center; gap: 0.55rem;
  padding: clamp(0.65rem,1.2vw,0.85rem) clamp(0.7rem,1.2vw,1rem);
  color: var(--muted2); cursor: pointer;
  border-bottom: 1px solid var(--border2);
  transition: var(--ease); min-height: 48px;
  border-left: 3px solid transparent;
}
.legal-item:hover { background: var(--surface2); color: var(--text); }
.legal-item:active { background: var(--surface3); }
.legal-item.active { background: var(--orange-dim); color: var(--orange); border-left-color: var(--orange); }
.li-icon { font-size: 0.85rem; flex-shrink: 0; }
.li-label { font-size: var(--text-sm); flex: 1; }

/* ═══════════════════════════════════════════════════════════
   BOTTOM NAV  — mobile only
═══════════════════════════════════════════════════════════ */
#bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(17,17,22,0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  z-index: 450;
  display: none;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
}
.bn-item {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 0.22rem; padding: 0.5rem 0.25rem;
  cursor: pointer; transition: var(--ease);
  min-height: 56px; text-decoration: none;
}
.bn-item:active { opacity: 0.7; }
.bn-icon { font-size: 1.15rem; line-height: 1; position: relative; }
.bn-label {
  font-family: var(--font-m); font-size: 0.58rem;
  letter-spacing: 0.06em; color: var(--muted);
  white-space: nowrap; text-align: center;
}
.bn-item.active .bn-icon { filter: drop-shadow(0 0 6px var(--orange-glow)); }
.bn-item.active .bn-label { color: var(--orange); }

/* ═══════════════════════════════════════════════════════════
   DRAWER  — slides in from left, all breakpoints
═══════════════════════════════════════════════════════════ */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 600;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0; transition: opacity 0.25s ease;
}
#overlay.open { display: block; }
#overlay.visible { opacity: 1; }

#drawer {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: min(320px, 88vw);
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 700; overflow-y: auto; overflow-x: hidden;
  transform: translateX(-100%);
  transition: transform var(--ease2);
  padding-top: calc(var(--header-h) + 0.5rem);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 1rem);
}
#drawer.open { transform: translateX(0); }

.drawer-section { margin-bottom: 0.25rem; }
.drawer-sec-label {
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.18em; color: var(--muted);
  padding: 0.7rem 1rem 0.4rem;
  border-bottom: 1px solid var(--border2);
  position: sticky; top: 0; background: var(--surface); z-index: 5;
}
.drawer-item {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.75rem 1rem; cursor: pointer;
  color: var(--muted2); font-size: var(--text-sm);
  border-radius: 0; transition: var(--ease);
  min-height: 52px;
  border-left: 3px solid transparent;
}
.drawer-item:hover { background: var(--surface2); color: var(--text); }
.drawer-item:active { background: var(--surface3); }
.drawer-item.active { background: var(--orange-dim); color: var(--orange); border-left-color: var(--orange); }
.drawer-item-icon { font-size: 1rem; flex-shrink: 0; width: 1.4rem; text-align: center; }
.drawer-item-label { flex: 1; }

.drawer-close-row {
  padding: 0.75rem 1rem;
  border-top: 1px solid var(--border2);
  position: sticky; bottom: 0; background: var(--surface);
}
.btn-close-drawer {
  width: 100%; padding: 0.75rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--muted2);
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.08em; cursor: pointer;
  transition: var(--ease);
}
.btn-close-drawer:hover { background: var(--surface3); color: var(--text); }

/* ═══════════════════════════════════════════════════════════
   PAGE CONTENT  — shared by all subpages
═══════════════════════════════════════════════════════════ */
.pc { max-width: 820px; margin: 0 auto; }
.pc-wide { max-width: 1100px; margin: 0 auto; }

/* Page header */
.pc-header { margin-bottom: clamp(1.25rem, 3vw, 2rem); }
.pc-pill {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.12em; color: var(--muted2);
  border: 1px solid var(--border);
  padding: 0.25em 0.7em; border-radius: 99px;
  margin-bottom: 0.7rem;
}
.pc-pill span { color: var(--orange); }
.pc h1 {
  font-size: var(--text-2xl); font-weight: 800;
  letter-spacing: -0.03em; line-height: 1.15;
  margin-bottom: 0.3rem;
}
.pc-meta {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted); letter-spacing: 0.1em;
}
.pc h2 {
  font-size: var(--text-lg); font-weight: 700;
  color: var(--text2); letter-spacing: -0.02em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5rem;
  margin: clamp(1.5rem,3vw,2.25rem) 0 clamp(0.6rem,1.5vw,1rem);
}
.pc p { font-size: var(--text-base); line-height: 1.8; color: var(--text2); margin-bottom: 0.85rem; }
.pc ul { margin: 0.5rem 0 0.85rem 1.5rem; }
.pc li { font-size: var(--text-base); line-height: 1.8; color: var(--text2); margin-bottom: 0.2rem; }
.pc strong { color: var(--text); }
code.inline {
  font-family: var(--font-m); font-size: 0.9em;
  color: var(--orange); background: var(--orange-dim);
  padding: 0.1em 0.4em; border-radius: 3px;
}

/* Stat row */
.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(clamp(90px, 15vw, 130px), 1fr));
  gap: clamp(0.5rem, 1.5vw, 0.85rem);
  margin: clamp(1rem,2vw,1.5rem) 0 clamp(1.25rem,3vw,2rem);
}
.stat-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: clamp(0.75rem,2vw,1.1rem);
  transition: var(--ease);
}
.stat-card:hover { border-color: var(--orange); }
.stat-val {
  font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800;
  color: var(--orange); letter-spacing: -0.04em; line-height: 1;
  margin-bottom: 0.25rem;
}
.stat-lbl {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted2); letter-spacing: 0.1em;
}

/* Comparison grid */
.cmp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(160px, 22vw, 220px), 1fr));
  gap: clamp(0.5rem, 1.5vw, 0.85rem);
  margin: clamp(0.75rem,1.5vw,1rem) 0 clamp(1.25rem,3vw,2rem);
}
.cmp-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: clamp(0.75rem,2vw,1.1rem);
  transition: border-color var(--ease);
}
.cmp-card:hover { border-color: var(--border); }
.cmp-name {
  font-size: var(--text-sm); font-weight: 700;
  margin-bottom: 0.65rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border2);
}
.cmp-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: var(--text-xs); color: var(--muted2);
  padding: 0.28rem 0;
  border-bottom: 1px solid var(--border2);
  gap: 0.5rem;
}
.cmp-row:last-child { border-bottom: none; }
.cmp-row span:first-child { flex: 1; }
.cmp-val { color: var(--text); font-family: var(--font-m); text-align: right; flex-shrink: 0; }
.cmp-val.good { color: var(--green); }
.cmp-val.warn { color: var(--yellow); }

/* Trending list */
.trend-list { margin: clamp(0.75rem,1.5vw,1rem) 0 clamp(1.25rem,3vw,2rem); }
.trend-item {
  display: flex; align-items: center; gap: clamp(0.75rem, 2vw, 1.25rem);
  padding: clamp(0.65rem,1.5vw,0.9rem) 0;
  border-bottom: 1px solid var(--border2);
  transition: var(--ease);
}
.trend-item:hover { padding-left: 0.25rem; }
.trend-rank {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted); width: 1.6rem; flex-shrink: 0; text-align: right;
}
.trend-info { flex: 1; min-width: 0; }
.trend-name { font-size: var(--text-base); font-weight: 600; margin-bottom: 0.15rem; }
.trend-sub { font-size: var(--text-xs); color: var(--muted2); font-family: var(--font-m); }
.trend-badge {
  font-family: var(--font-m); font-size: var(--text-xs);
  padding: 0.2em 0.6em; border-radius: 99px;
  border: 1px solid; flex-shrink: 0;
  white-space: nowrap;
}
.badge-up    { color: var(--green);  border-color: rgba(61,220,151,0.3);  background: rgba(61,220,151,0.08); }
.badge-down  { color: var(--red);    border-color: rgba(255,68,68,0.3);   background: rgba(255,68,68,0.08); }
.badge-new   { color: var(--orange); border-color: var(--orange-dim);     background: var(--orange-dim); }
.badge-stable{ color: var(--muted2); border-color: var(--border);         background: transparent; }

/* Watchlist */
.wl-list { margin: clamp(0.75rem,1.5vw,1rem) 0; }
.wl-item {
  display: flex; align-items: center; gap: clamp(0.65rem, 2vw, 1rem);
  padding: clamp(0.7rem,1.5vw,1rem) clamp(0.75rem,2vw,1rem);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 0.5rem;
  transition: var(--ease);
}
.wl-item:hover { border-color: var(--border); background: var(--surface3); }
.wl-emoji { font-size: clamp(1.1rem, 2.5vw, 1.4rem); flex-shrink: 0; }
.wl-info { flex: 1; min-width: 0; }
.wl-name { font-size: var(--text-sm); font-weight: 700; margin-bottom: 0.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wl-sub  { font-family: var(--font-m); font-size: var(--text-xs); color: var(--muted2); }
.wl-price { font-family: var(--font-m); font-size: var(--text-sm); font-weight: 700; color: var(--orange); flex-shrink: 0; }
.wl-price.drop { color: var(--green); }

/* Home screen */
.home-wrap { max-width: 820px; margin: 0 auto; }
.home-hero { margin-bottom: clamp(1.5rem,3vw,2.5rem); }
.home-hero h1 {
  font-size: var(--text-2xl); font-weight: 800;
  letter-spacing: -0.04em; line-height: 1.1;
  margin-bottom: 0.5rem;
}
.home-hero h1 em { font-style: normal; color: var(--orange); }
.home-hero p {
  font-size: var(--text-base); color: var(--muted2);
  max-width: 480px; line-height: 1.7;
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 20vw, 200px), 1fr));
  gap: clamp(0.5rem, 1.5vw, 0.85rem);
  margin-bottom: clamp(1.5rem, 3vw, 2.5rem);
}
.home-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: clamp(0.9rem, 2vw, 1.25rem);
  cursor: pointer; transition: var(--ease2);
}
.home-card:hover {
  border-color: var(--orange);
  background: var(--surface3);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.home-card:active { transform: translateY(0); }
.home-card-icon { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 0.7rem; line-height: 1; }
.home-card-title { font-size: var(--text-sm); font-weight: 700; margin-bottom: 0.25rem; }
.home-card-desc { font-size: var(--text-xs); color: var(--muted2); line-height: 1.5; }
.home-card-arrow { color: var(--orange); font-size: var(--text-xs); margin-top: 0.5rem; opacity: 0; transition: opacity var(--ease); }
.home-card:hover .home-card-arrow { opacity: 1; }

.home-legal {
  border-top: 1px solid var(--border);
  padding-top: clamp(0.85rem, 2vw, 1.25rem);
}
.home-legal-label {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted); letter-spacing: 0.15em; margin-bottom: 0.65rem;
}
.home-legal-btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.home-legal-btn {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted2); padding: 0.4em 0.9em;
  border: 1px solid var(--border); border-radius: 99px;
  background: transparent; cursor: pointer;
  transition: var(--ease);
}
.home-legal-btn:hover { color: var(--text); border-color: var(--muted2); background: var(--surface2); }

/* Product placeholder */
.prod-detail { max-width: 640px; margin: 0 auto; }
.prod-detail-header {
  display: flex; align-items: flex-start; gap: 1rem;
  margin-bottom: clamp(1.25rem, 3vw, 2rem);
  padding: clamp(1rem, 2.5vw, 1.5rem);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.prod-detail-icon { font-size: clamp(2rem, 5vw, 3rem); flex-shrink: 0; }
.prod-detail-name { font-size: var(--text-xl); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.25rem; }
.prod-detail-cat { font-family: var(--font-m); font-size: var(--text-xs); color: var(--orange); letter-spacing: 0.1em; }
.prod-todo {
  background: var(--surface2); border: 1px dashed var(--border);
  border-radius: var(--radius-lg); padding: 1.25rem;
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--muted); letter-spacing: 0.05em; line-height: 1.7;
  margin-top: 1rem;
}
.prod-todo .todo-badge {
  display: inline-block; background: var(--orange-dim);
  color: var(--orange); padding: 0.2em 0.6em; border-radius: 3px;
  margin-bottom: 0.5rem; font-size: var(--text-xs); letter-spacing: 0.12em;
}

/* Seller placeholder */
.seller-ph {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; gap: 0.85rem;
  text-align: center; color: var(--muted2); padding: 2rem;
}
.seller-ph-icon { font-size: clamp(2.5rem, 6vw, 4rem); opacity: 0.35; }
.seller-ph h3 { font-size: var(--text-xl); font-weight: 800; color: var(--text); }
.seller-ph p { font-size: var(--text-base); max-width: 380px; line-height: 1.7; }
.seller-ph .todo {
  font-family: var(--font-m); font-size: var(--text-xs);
  letter-spacing: 0.1em; border: 1px dashed var(--border);
  padding: 0.35em 0.85em; border-radius: 99px; color: var(--muted);
}

/* Loading & error */
.loading-box {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 50vh; gap: 1rem; color: var(--muted2);
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: var(--font-m); font-size: var(--text-xs); letter-spacing: 0.15em; }

.error-box {
  max-width: 480px; margin: 3rem auto;
  display: flex; flex-direction: column; gap: 0.85rem;
}
.error-badge {
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--red); border: 1px solid rgba(255,68,68,0.3);
  padding: 0.25em 0.75em; border-radius: 99px; width: fit-content;
  letter-spacing: 0.1em;
}
.error-title { font-size: var(--text-xl); font-weight: 800; }
.error-msg { font-size: var(--text-sm); color: var(--muted2); line-height: 1.6; }
.error-code { font-family: var(--font-m); font-size: var(--text-xs); color: var(--muted); }
.btn-rawfile {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: var(--font-m); font-size: var(--text-xs);
  color: var(--orange); border: 1px solid var(--orange-dim);
  padding: 0.5em 1.1em; border-radius: var(--radius);
  text-decoration: none; width: fit-content;
  transition: var(--ease);
}
.btn-rawfile:hover { background: var(--orange-dim); }

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
═══════════════════════════════════════════════════════════ */

/* Tablet — hide right sidebar */
@media (max-width: 1024px) {
  #shell { grid-template-columns: var(--sidebar-w) 1fr; }
  #sidebar-right { display: none; }
}

/* Mobile — single column, bottom nav */
@media (max-width: 680px) {
  #shell {
    grid-template-columns: 1fr;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  #sidebar-left   { display: none; }
  #sidebar-right  { display: none; }
  .h-search       { display: none; }
  .btn-home       { display: none; }
  .btn-yt span    { display: none; }
  .btn-ham        { display: flex; }
  #bottom-nav     { display: grid; }

  #tab-nav { display: none; } /* replaced by bottom nav */
}

/* Very small phones */
@media (max-width: 360px) {
  :root { --header-h: 50px; --nav-h: 56px; }
  .h-logo { font-size: 0.9rem; }
  .h-modes { display: none; }
}

/* Landscape phone */
@media (max-width: 680px) and (orientation: landscape) {
  :root { --nav-h: 52px; }
  #bottom-nav .bn-label { display: none; }
}

/* Tablet portrait — show tabs, hide bottom nav */
@media (min-width: 681px) and (max-width: 1024px) {
  #bottom-nav { display: none; }
  #shell { grid-template-columns: var(--sidebar-w) 1fr; }
}

/* Large / TV: spacious */
@media (min-width: 2000px) {
  #shell { grid-template-columns: var(--sidebar-w) 1fr var(--right-w); }
  .page-tab { height: 56px; }
  .prod-item { min-height: 48px; }
  .legal-item { min-height: 56px; }
}
</style>
</head>

<script>
'use strict';

/* ══════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════ */
const YOUTUBE_CHANNEL_URL = "https://youtube.com/@yourchannel"; // TODO: update

/* ══════════════════════════════════════════════
   MODE SYSTEM
   Add { id:"seller", label:"Seller Portal" } + renderSellerShell() to enable.
══════════════════════════════════════════════ */
let MODE = "buyer";
const MODES = [
  { id: "buyer",  label: "Buyer Mode" },
  // TODO: { id: "seller", label: "Seller Portal" },
];

/* ══════════════════════════════════════════════
   PAGES REGISTRY
   name     → matches <template id="tpl-{name}">
   file     → href/fetch fallback if template missing
   section  → "products" | "legal"
   icon     → symbol
   bnIcon   → emoji for bottom nav (mobile)
   bnLabel  → short label for bottom nav
══════════════════════════════════════════════ */
const PAGES = [
  { name:"overview",   label:"Overview",      file:"overview.html",   section:"products", icon:"◈", bnIcon:"◈", bnLabel:"Overview" },
  { name:"compare",    label:"Compare",        file:"compare.html",    section:"products", icon:"⇄", bnIcon:"⇄", bnLabel:"Compare"  },
  { name:"trending",   label:"Trending",       file:"trending.html",   section:"products", icon:"↑", bnIcon:"🔥",bnLabel:"Trending"  },
  { name:"watchlist",  label:"Watchlist",      file:"watchlist.html",  section:"products", icon:"☆", bnIcon:"☆", bnLabel:"Watchlist" },
  { name:"terms",      label:"Terms",          file:"terms.html",      section:"legal",    icon:"§" },
  { name:"privacy",    label:"Privacy Policy", file:"privacy.html",    section:"legal",    icon:"⬡" },
  { name:"conditions", label:"Conditions",     file:"conditions.html", section:"legal",    icon:"⊞" },
  { name:"rules",      label:"Rules",          file:"rules.html",      section:"legal",    icon:"▤" },
  // TODO: seller pages → section:"seller"
];

/* ══════════════════════════════════════════════
   PRODUCTS  ← edit this array to add/remove items
══════════════════════════════════════════════ */
const PRODUCTS = [
  { id:"phones",   label:"Phones",   icon:"📱", items:[
    { id:"iphone-16",  label:"iPhone 16 Pro" },
    { id:"pixel-9",    label:"Pixel 9 Pro" },
    { id:"s25-ultra",  label:"Galaxy S25 Ultra" },
    { id:"oneplus-13", label:"OnePlus 13" },
  ]},
  { id:"laptops",  label:"Laptops",  icon:"💻", items:[
    { id:"mbp-m4",      label:"MacBook Pro M4" },
    { id:"thinkpad-x1", label:"ThinkPad X1 Carbon" },
    { id:"dell-xps15",  label:"Dell XPS 15" },
    { id:"lg-gram",     label:"LG Gram 16" },
  ]},
  { id:"earbuds",  label:"Earbuds",  icon:"🎧", items:[
    { id:"airpods-pro", label:"AirPods Pro 2" },
    { id:"buds3-pro",   label:"Galaxy Buds3 Pro" },
    { id:"bose-qc",     label:"Bose QC Ultra" },
    { id:"wf1000xm6",   label:"Sony WF-1000XM6" },
  ]},
  { id:"monitors", label:"Monitors", icon:"🖥️", items:[
    { id:"lg-ultrafine", label:"LG UltraFine 5K" },
    { id:"dell-u2723d",  label:"Dell UltraSharp 27" },
    { id:"lg-oled",      label:"LG OLED 27 4K" },
  ]},
];

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let activePageName   = null;
let activeProductId  = null;
let isLoading        = false;

/* ══════════════════════════════════════════════
   ROUTING
══════════════════════════════════════════════ */
function registerRoutes() {
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

function handleRoute() {
  const hash = window.location.hash;
  if (hash.startsWith('#page=')) {
    const key  = hash.slice(6);
    const page = PAGES.find(p => p.file === key || p.name === key);
    if (page) { loadPage(page.name, false); return; }
  }
  renderHomePage();
}

/* ══════════════════════════════════════════════
   RENDER SHELL
══════════════════════════════════════════════ */
function renderShell() {
  document.getElementById('ytBtn').href = YOUTUBE_CHANNEL_URL;
  renderModeTabs();
  renderSidebar();
  renderTabNav();
  renderRightSidebar();
  renderBottomNav();
  renderDrawerContent();
}

/* ══════════════════════════════════════════════
   MODE TABS
══════════════════════════════════════════════ */
function renderModeTabs() {
  document.getElementById('modeTabs').innerHTML = MODES.map(m =>
    `<button class="mode-tab ${m.id===MODE?'active':''}"
             onclick="switchMode('${m.id}')"
             role="tab" aria-selected="${m.id===MODE}">${escH(m.label)}</button>`
  ).join('');
}

function switchMode(mode) {
  MODE = mode;
  renderModeTabs();
  if (mode === 'buyer') renderHomePage();
  else renderSellerPlaceholder();
  // TODO: else if (mode === 'seller') renderSellerShell();
}

/* ══════════════════════════════════════════════
   LEFT SIDEBAR
══════════════════════════════════════════════ */
function renderSidebar() {
  const open = getOpenCats();
  document.getElementById('sidebar-left').innerHTML = `
    <div class="sb-head">
      <span class="sb-head-label">MY PRODUCTS</span>
      <button class="sb-head-action" onclick="collapseAll()" title="Collapse all">−</button>
    </div>
    <div class="sb-body">${PRODUCTS.map(c => renderCat(c, open)).join('')}</div>
  `;
}

function renderCat(cat, open) {
  const isOpen = open.includes(cat.id);
  return `
    <div class="cat-wrap">
      <div class="cat-head" onclick="toggleCat('${cat.id}')"
           role="button" aria-expanded="${isOpen}" tabindex="0"
           onkeydown="if(event.key==='Enter'||event.key===' ')toggleCat('${cat.id}')">
        <span class="cat-emoji" aria-hidden="true">${cat.icon}</span>
        <span class="cat-name">${escH(cat.label)}</span>
        <span class="cat-count">${cat.items.length}</span>
        <svg class="cat-chevron ${isOpen?'open':''}" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><polyline points="3,2 9,6 3,10"/></svg>
      </div>
      <div class="cat-items ${isOpen?'open':''}" role="list">
        ${cat.items.map(item => `
          <div class="prod-item ${item.id===activeProductId?'active':''}"
               onclick="selectProduct('${cat.id}','${item.id}','${escH(item.label)}','${cat.icon}')"
               role="listitem" tabindex="0"
               onkeydown="if(event.key==='Enter')selectProduct('${cat.id}','${item.id}','${escH(item.label)}','${cat.icon}')">
            <span class="prod-dot" aria-hidden="true"></span>
            <span class="prod-name">${escH(item.label)}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function getOpenCats() {
  try { return JSON.parse(sessionStorage.getItem('openCats') || '["phones"]'); }
  catch(e) { return ["phones"]; }
}

function toggleCat(id) {
  let o = getOpenCats();
  o = o.includes(id) ? o.filter(x => x !== id) : [...o, id];
  sessionStorage.setItem('openCats', JSON.stringify(o));
  renderSidebar();
}

function collapseAll() {
  sessionStorage.setItem('openCats', '[]');
  renderSidebar();
}

function selectProduct(catId, itemId, label, emoji) {
  activeProductId = itemId;
  activePageName  = null;
  setActive(null);
  closeDrawer();
  history.replaceState(null, '', window.location.pathname);
  document.getElementById('main-content').innerHTML = `
    <div class="prod-detail page-enter">
      <div class="prod-detail-header">
        <div class="prod-detail-icon">${emoji}</div>
        <div>
          <div class="prod-detail-name">${escH(label)}</div>
          <div class="prod-detail-cat">${escH(catId.toUpperCase())}</div>
        </div>
      </div>
      <p style="font-size:var(--text-base);color:var(--text2);line-height:1.7">
        Use the <strong>Compare</strong>, <strong>Trending</strong>, or <strong>Overview</strong> tabs above to explore structured data across all products. This panel is reserved for product-specific deep dives.
      </p>
      <div class="prod-todo">
        <div class="todo-badge">TODO</div><br>
        Connect product ID <code class="inline">${escH(itemId)}</code> to a live data source. Render specs, pricing history, user reviews, and availability here.
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   TAB NAV (desktop/tablet)
══════════════════════════════════════════════ */
function renderTabNav() {
  document.getElementById('tab-nav').innerHTML = PAGES
    .filter(p => p.section === 'products')
    .map(p => `
      <button class="page-tab ${activePageName===p.name?'active':''}"
              onclick="loadPage('${p.name}')"
              role="tab" aria-selected="${activePageName===p.name}">
        <span class="tab-ic" aria-hidden="true">${p.icon}</span>${escH(p.label)}
      </button>`).join('');
}

/* ══════════════════════════════════════════════
   RIGHT SIDEBAR
══════════════════════════════════════════════ */
function renderRightSidebar() {
  document.getElementById('sidebar-right').innerHTML =
    `<div class="rs-head">LEGAL</div>` +
    PAGES.filter(p => p.section === 'legal').map(p => `
      <div class="legal-item ${activePageName===p.name?'active':''}"
           onclick="loadPage('${p.name}')"
           role="button" tabindex="0"
           onkeydown="if(event.key==='Enter')loadPage('${p.name}')">
        <span class="li-icon" aria-hidden="true">${p.icon}</span>
        <span class="li-label">${escH(p.label)}</span>
      </div>`).join('');
}

/* ══════════════════════════════════════════════
   BOTTOM NAV (mobile)
══════════════════════════════════════════════ */
function renderBottomNav() {
  const productPages = PAGES.filter(p => p.section === 'products');
  // 4 product pages + 1 "More" drawer opener
  document.getElementById('bottom-nav').innerHTML =
    productPages.map(p => `
      <div class="bn-item ${activePageName===p.name?'active':''}"
           onclick="loadPage('${p.name}')"
           role="button" tabindex="0"
           aria-label="${escH(p.label)}"
           onkeydown="if(event.key==='Enter')loadPage('${p.name}')">
        <span class="bn-icon" aria-hidden="true">${p.bnIcon||p.icon}</span>
        <span class="bn-label">${escH(p.bnLabel||p.label)}</span>
      </div>`).join('') +
    `<div class="bn-item" onclick="openDrawer()"
          role="button" tabindex="0" aria-label="Open menu">
       <span class="bn-icon" aria-hidden="true">☰</span>
       <span class="bn-label">More</span>
     </div>`;
}

/* ══════════════════════════════════════════════
   DRAWER
══════════════════════════════════════════════ */
function renderDrawerContent() {
  const sections = [
    { key:'products', label:'VIEWS' },
    { key:'legal',    label:'LEGAL' },
  ];
  let html = '';

  sections.forEach(sec => {
    html += `<div class="drawer-section"><div class="drawer-sec-label">${sec.label}</div>`;
    PAGES.filter(p => p.section === sec.key).forEach(p => {
      html += `<div class="drawer-item ${activePageName===p.name?'active':''}"
                    onclick="loadPage('${p.name}');closeDrawer()"
                    role="button" tabindex="0"
                    onkeydown="if(event.key==='Enter'){loadPage('${p.name}');closeDrawer()}">
                 <span class="drawer-item-icon" aria-hidden="true">${p.icon}</span>
                 <span class="drawer-item-label">${escH(p.label)}</span>
               </div>`;
    });
    html += `</div>`;
  });

  html += `<div class="drawer-section"><div class="drawer-sec-label">MY PRODUCTS</div>`;
  PRODUCTS.forEach(cat => {
    cat.items.forEach(item => {
      html += `<div class="drawer-item ${item.id===activeProductId?'active':''}"
                    onclick="selectProduct('${cat.id}','${item.id}','${escH(item.label)}','${cat.icon}');closeDrawer()"
                    role="button" tabindex="0">
                 <span class="drawer-item-icon" aria-hidden="true">${cat.icon}</span>
                 <span class="drawer-item-label">${escH(item.label)}</span>
               </div>`;
    });
  });
  html += `</div>`;

  html += `<div class="drawer-section"><div class="drawer-sec-label">NAVIGATE</div>
    <div class="drawer-item" onclick="renderHomePage();closeDrawer()" role="button" tabindex="0">
      <span class="drawer-item-icon">⌂</span><span class="drawer-item-label">Home Dashboard</span>
    </div>
    <div class="drawer-item" onclick="window.location.href='intro.html'" role="button" tabindex="0">
      <span class="drawer-item-icon">←</span><span class="drawer-item-label">Back to Intro</span>
    </div>
  </div>`;

  html += `<div class="drawer-close-row">
    <button class="btn-close-drawer" onclick="closeDrawer()">CLOSE MENU</button>
  </div>`;

  document.getElementById('drawer-inner').innerHTML = html;
}

function openDrawer() {
  renderDrawerContent();
  const overlay = document.getElementById('overlay');
  const drawer  = document.getElementById('drawer');
  overlay.style.display = 'block';
  requestAnimationFrame(() => {
    overlay.classList.add('open');
    requestAnimationFrame(() => overlay.classList.add('visible'));
  });
  drawer.classList.add('open');
  document.getElementById('hamBtn').setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  const overlay = document.getElementById('overlay');
  const drawer  = document.getElementById('drawer');
  overlay.classList.remove('visible');
  drawer.classList.remove('open');
  document.getElementById('hamBtn').setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
  setTimeout(() => {
    overlay.classList.remove('open');
    overlay.style.display = '';
  }, 260);
}

// Close drawer on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
});

/* ══════════════════════════════════════════════
   LOAD PAGE  — template-first, zero 404s possible
   1. Try embedded <template id="tpl-{name}"> (instant, offline-safe)
   2. No template → try fetch() (server environments)
   3. Fetch fails → friendly error, no infinite loop
══════════════════════════════════════════════ */
function loadPage(pageName, pushHistory = true) {
  if (isLoading) return;
  const page = PAGES.find(p => p.name === pageName);
  if (!page) { showError('Unknown page', pageName, null); return; }
  if (pageName === activePageName) return; // already shown

  isLoading       = true;
  activePageName  = pageName;
  activeProductId = null;

  if (pushHistory) history.replaceState(null, '', `#page=${page.file}`);

  setActive(pageName);

  // 1. Try embedded template
  const tpl = document.getElementById(`tpl-${pageName}`);
  if (tpl) {
    isLoading = false;
    const clone = document.importNode(tpl.content, true);
    const wrap  = document.createElement('div');
    wrap.appendChild(clone);
    injectContent(wrap.innerHTML);
    return;
  }

  // 2. Fetch fallback
  showLoading();
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  fetch(page.file, { signal: ctrl.signal })
    .finally(() => clearTimeout(timer))
    .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
    .then(text => { isLoading = false; injectContent(extractBody(text)); })
    .catch(err => { isLoading = false; showError(page.label, page.file, err); });
}

function extractBody(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return (doc.querySelector('main') || doc.querySelector('.pc') || doc.querySelector('body') || { innerHTML: html }).innerHTML;
}

function injectContent(html) {
  const el = document.getElementById('main-content');
  el.innerHTML = html;
  el.scrollTop = 0;
  el.focus({ preventScroll: true });
}

/* ══════════════════════════════════════════════
   ACTIVE STATE  — sync all nav surfaces
══════════════════════════════════════════════ */
function setActive(pageName) {
  activePageName = pageName;
  renderTabNav();
  renderRightSidebar();
  renderSidebar();
  renderBottomNav();
}

/* ══════════════════════════════════════════════
   UI STATE RENDERERS
══════════════════════════════════════════════ */
function showLoading() {
  document.getElementById('main-content').innerHTML = `
    <div class="loading-box">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <span class="loading-text">LOADING…</span>
    </div>`;
}

function showError(label, file, err) {
  document.getElementById('main-content').innerHTML = `
    <div class="error-box page-enter">
      <span class="error-badge">ERROR · LOAD FAILED</span>
      <h2 class="error-title">${escH(label)}</h2>
      <p class="error-msg">The page could not be loaded.</p>
      ${err ? `<code class="error-code">${escH(String(err))}</code>` : ''}
      <a href="${escH(file)}" target="_blank" rel="noopener noreferrer" class="btn-rawfile">
        Open Raw File ↗
      </a>
    </div>`;
}

function renderHomePage() {
  activePageName  = null;
  activeProductId = null;
  history.replaceState(null, '', window.location.pathname);
  setActive(null);

  const productPages = PAGES.filter(p => p.section === 'products');
  const legalPages   = PAGES.filter(p => p.section === 'legal');

  document.getElementById('main-content').innerHTML = `
    <div class="home-wrap page-enter">
      <div class="home-hero">
        <h1>Welcome to <em>VIA&nbsp;Decide</em></h1>
        <p>Research, compare, and decide on the tech that matters — structured data, zero noise.</p>
      </div>
      <div class="home-grid">
        ${productPages.map(p => `
          <div class="home-card" onclick="loadPage('${p.name}')" role="button" tabindex="0"
               onkeydown="if(event.key==='Enter')loadPage('${p.name}')">
            <div class="home-card-icon">${p.icon}</div>
            <div class="home-card-title">${escH(p.label)}</div>
            <div class="home-card-desc">Open ${escH(p.label.toLowerCase())} view</div>
            <div class="home-card-arrow">→</div>
          </div>`).join('')}
      </div>
      <div class="home-legal">
        <p class="home-legal-label">LEGAL</p>
        <div class="home-legal-btns">
          ${legalPages.map(p => `
            <button class="home-legal-btn" onclick="loadPage('${p.name}')">
              ${p.icon} ${escH(p.label)}
            </button>`).join('')}
        </div>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════ */
document.getElementById('searchInput').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  if (!q) { renderSidebar(); return; }

  const results = [];
  PRODUCTS.forEach(cat => cat.items.forEach(item => {
    if (item.label.toLowerCase().includes(q)) results.push({ cat, item });
  }));

  const sb = document.getElementById('sidebar-left');
  if (!results.length) {
    sb.innerHTML = `
      <div class="sb-head"><span class="sb-head-label">SEARCH</span></div>
      <div class="sb-body" style="padding:1rem;font-size:var(--text-sm);color:var(--muted)">
        No results for "<em>${escH(q)}</em>"
      </div>`;
    return;
  }

  sb.innerHTML = `
    <div class="sb-head">
      <span class="sb-head-label">RESULTS</span>
      <span style="font-family:var(--font-m);font-size:var(--text-xs);color:var(--orange)">${results.length}</span>
    </div>
    <div class="sb-body">
      ${results.map(r => `
        <div class="prod-item ${r.item.id===activeProductId?'active':''}"
             onclick="selectProduct('${r.cat.id}','${r.item.id}','${escH(r.item.label)}','${r.cat.icon}')"
             role="button" tabindex="0">
          <span class="prod-dot" aria-hidden="true"></span>
          <span class="prod-name">${escH(r.item.label)}</span>
          <span style="margin-left:auto;font-size:0.85rem">${r.cat.icon}</span>
        </div>`).join('')}
    </div>`;
});

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function escH(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
