<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIA Decide — Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #14141a;
      --surface2: #1c1c24;
      --border: #252530;
      --border2: #1e1e28;
      --orange: #ff6b2b;
      --orange-dim: rgba(255,107,43,0.15);
      --text: #e8e8f0;
      --muted: #5a5a70;
      --muted2: #8080a0;
      --sidebar-w: 220px;
      --right-w: 180px;
      --header-h: 52px;
      --font-d: 'Syne', sans-serif;
      --font-m: 'DM Mono', monospace;
      --ease: 0.18s ease;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-d); }
    body { overflow: hidden; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ════ HEADER ════ */
    #header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 0.85rem; gap: 0.6rem; z-index: 200;
    }
    .h-logo { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.03em; color: var(--text); text-decoration: none; white-space: nowrap; flex-shrink: 0; }
    .h-logo span { color: var(--orange); }
    .h-mode-wrap { display: flex; gap: 2px; flex-shrink: 0; }
    .mode-tab { font-family: var(--font-m); font-size: 0.65rem; letter-spacing: 0.08em; padding: 0.28rem 0.65rem; border: 1px solid var(--border); background: transparent; color: var(--muted2); cursor: pointer; transition: var(--ease); border-radius: 2px; }
    .mode-tab.active { background: var(--orange-dim); border-color: var(--orange); color: var(--orange); }
    .mode-tab:hover:not(.active) { background: var(--surface2); color: var(--text); }
    .h-spacer { flex: 1; min-width: 0; }
    .h-search { display: flex; align-items: center; gap: 0.4rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; padding: 0.28rem 0.6rem; }
    .h-search input { background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-m); font-size: 0.75rem; width: 130px; }
    .h-search input::placeholder { color: var(--muted); }
    .btn-yt { display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid var(--border); background: transparent; color: var(--muted2); font-family: var(--font-m); font-size: 0.65rem; letter-spacing: 0.06em; padding: 0.3rem 0.75rem; cursor: pointer; text-decoration: none; border-radius: 2px; white-space: nowrap; transition: var(--ease); flex-shrink: 0; }
    .btn-yt:hover { border-color: #f00; color: #f55; background: rgba(255,0,0,0.06); }
    .btn-yt .yi { color: #f55; }
    .btn-intro { font-family: var(--font-m); font-size: 0.65rem; color: var(--muted2); text-decoration: none; padding: 0.3rem 0.6rem; border: 1px solid var(--border); border-radius: 2px; transition: var(--ease); flex-shrink: 0; }
    .btn-intro:hover { color: var(--text); border-color: var(--muted2); }
    .btn-ham { display: none; background: transparent; border: 1px solid var(--border); border-radius: 2px; padding: 0.3rem 0.55rem; color: var(--muted2); cursor: pointer; font-size: 1rem; flex-shrink: 0; line-height: 1; }

    /* ════ 3-COL SHELL ════ */
    #shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr var(--right-w); height: 100vh; padding-top: var(--header-h); }

    /* ── LEFT SIDEBAR ── */
    #sidebar-left { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
    .sb-label { font-family: var(--font-m); font-size: 0.58rem; letter-spacing: 0.18em; color: var(--muted); padding: 0.65rem 0.75rem 0.45rem; border-bottom: 1px solid var(--border2); display: flex; align-items: center; justify-content: space-between; }
    .sb-collapse { cursor: pointer; color: var(--orange); font-size: 0.9rem; line-height: 1; }
    .sb-section { padding: 0.5rem 0.6rem 0.25rem; }
    .cat-head { display: flex; align-items: center; gap: 0.45rem; padding: 0.38rem 0.45rem; cursor: pointer; border-radius: 3px; transition: var(--ease); user-select: none; }
    .cat-head:hover { background: var(--surface2); }
    .cat-icon { font-size: 0.85rem; }
    .cat-name { font-size: 0.78rem; font-weight: 600; flex: 1; }
    .cat-arrow { font-size: 0.6rem; color: var(--muted); transition: transform 0.2s; }
    .cat-arrow.open { transform: rotate(90deg); }
    .cat-items { overflow: hidden; max-height: 0; transition: max-height 0.22s ease; padding-left: 0.35rem; }
    .cat-items.open { max-height: 600px; }
    .prod-item { display: flex; align-items: center; gap: 0.45rem; padding: 0.38rem 0.45rem; border-radius: 3px; cursor: pointer; font-size: 0.77rem; color: var(--muted2); transition: var(--ease); }
    .prod-item:hover { background: var(--surface2); color: var(--text); }
    .prod-item.active { background: var(--orange-dim); color: var(--orange); }
    .prod-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* ── MAIN AREA ── */
    #main-wrap { display: flex; flex-direction: column; overflow: hidden; }
    #tab-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.55rem 0.85rem; display: flex; gap: 0.3rem; flex-wrap: wrap; flex-shrink: 0; }
    .page-tab { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.76rem; padding: 0.32rem 0.78rem; border: 1px solid var(--border); border-radius: 2px; background: transparent; color: var(--muted2); cursor: pointer; transition: var(--ease); white-space: nowrap; }
    .page-tab:hover { background: var(--surface2); color: var(--text); }
    .page-tab.active { background: var(--orange-dim); border-color: var(--orange); color: var(--orange); }
    .tab-ic { font-size: 0.82rem; }
    #main-content { flex: 1; overflow-y: auto; padding: 1.4rem 1.2rem; position: relative; }

    /* ── RIGHT SIDEBAR ── */
    #sidebar-right { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }
    .legal-item { display: flex; align-items: center; gap: 0.45rem; padding: 0.65rem 0.7rem; font-size: 0.76rem; color: var(--muted2); cursor: pointer; border-bottom: 1px solid var(--border2); transition: var(--ease); }
    .legal-item:hover { background: var(--surface2); color: var(--text); }
    .legal-item.active { background: var(--orange-dim); color: var(--orange); border-left: 2px solid var(--orange); }
    .li-ic { font-size: 0.82rem; }

    /* ════ MOBILE DRAWER ════ */
    #drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 300; }
    #drawer-overlay.open { display: block; }
    #drawer { position: fixed; top: 0; left: -285px; bottom: 0; width: 285px; background: var(--surface); border-right: 1px solid var(--border); z-index: 400; overflow-y: auto; transition: left 0.25s ease; padding-top: var(--header-h); }
    #drawer.open { left: 0; }
    .drawer-label { font-family: var(--font-m); font-size: 0.58rem; letter-spacing: 0.18em; color: var(--muted); padding: 0.6rem 0.75rem 0.4rem; border-bottom: 1px solid var(--border2); margin-bottom: 0.25rem; }
    .drawer-section { padding: 0.25rem 0.6rem 0.5rem; }
    .drawer-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.45rem; border-radius: 3px; font-size: 0.82rem; color: var(--muted2); cursor: pointer; transition: var(--ease); }
    .drawer-item:hover { background: var(--surface2); color: var(--text); }
    .drawer-item.active { background: var(--orange-dim); color: var(--orange); }
    .drawer-close { position: absolute; top: calc(var(--header-h) + 0.5rem); right: 0.75rem; background: transparent; border: 1px solid var(--border); border-radius: 2px; color: var(--muted2); cursor: pointer; font-size: 0.9rem; padding: 0.22rem 0.55rem; }

    /* ════ CONTENT STYLES ════ */
    .loading-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 0.85rem; color: var(--muted2); }
    .spinner { width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Home */
    .home-wrap { max-width: 680px; margin: 0 auto; }
    .home-wrap h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; }
    .home-wrap h2 span { color: var(--orange); }
    .home-sub { font-family: var(--font-m); font-size: 0.72rem; color: var(--muted2); letter-spacing: 0.06em; margin-bottom: 1.75rem; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px,1fr)); gap: 0.65rem; margin-bottom: 1.75rem; }
    .card { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.9rem; cursor: pointer; transition: var(--ease); }
    .card:hover { border-color: var(--orange); background: var(--orange-dim); }
    .card-ic { font-size: 1.3rem; margin-bottom: 0.45rem; }
    .card-t { font-size: 0.82rem; font-weight: 700; margin-bottom: 0.2rem; }
    .card-d { font-size: 0.73rem; color: var(--muted2); line-height: 1.5; }

    /* Page content */
    .pc { max-width: 720px; }
    .pc h1 { font-size: 1.55rem; font-weight: 800; margin-bottom: 0.35rem; }
    .pc .meta { font-family: var(--font-m); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; margin-bottom: 1.75rem; }
    .pc h2 { font-size: 0.95rem; font-weight: 700; color: var(--muted2); border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin: 1.75rem 0 0.65rem; }
    .pc p { font-size: 0.86rem; line-height: 1.8; color: #a0a0b8; margin-bottom: 0.7rem; }
    .pc ul { margin: 0.4rem 0 0.7rem 1.35rem; }
    .pc li { font-size: 0.86rem; line-height: 1.8; color: #a0a0b8; }
    .pc strong { color: var(--text); }
    .pc .pill { display: inline-block; font-family: var(--font-m); font-size: 0.65rem; letter-spacing: 0.1em; border: 1px solid var(--border); padding: 0.2rem 0.55rem; border-radius: 2px; color: var(--muted2); margin-bottom: 0.5rem; }
    .pc .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
    .pc .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.7rem 1rem; min-width: 100px; }
    .pc .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--orange); line-height: 1; margin-bottom: 0.2rem; }
    .pc .stat-lbl { font-family: var(--font-m); font-size: 0.63rem; color: var(--muted2); letter-spacing: 0.08em; }
    .pc .cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px,1fr)); gap: 0.6rem; margin: 0.75rem 0 1.25rem; }
    .pc .cc { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.8rem; }
    .pc .cc-name { font-size: 0.82rem; font-weight: 700; margin-bottom: 0.5rem; }
    .pc .cr { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted2); padding: 0.2rem 0; border-bottom: 1px solid var(--border2); }
    .pc .cr:last-child { border-bottom: none; }
    .pc .cv { color: var(--text); }
    .pc .tr-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0; border-bottom: 1px solid var(--border2); }
    .pc .tr-rank { font-family: var(--font-m); font-size: 0.68rem; color: var(--muted); width: 1.5rem; flex-shrink: 0; }
    .pc .tr-name { font-size: 0.84rem; font-weight: 600; flex: 1; }
    .pc .tr-tag { font-family: var(--font-m); font-size: 0.65rem; color: var(--orange); border: 1px solid var(--orange-dim); padding: 0.15rem 0.45rem; border-radius: 2px; }
    .pc .wl-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0; border-bottom: 1px solid var(--border2); }
    .pc .wl-ic { font-size: 1.1rem; }
    .pc .wl-info { flex: 1; }
    .pc .wl-name { font-size: 0.84rem; font-weight: 600; margin-bottom: 0.15rem; }
    .pc .wl-meta { font-family: var(--font-m); font-size: 0.66rem; color: var(--muted2); }
    .pc .wl-price { font-size: 0.88rem; font-weight: 700; color: var(--orange); }

    /* Seller placeholder */
    .seller-ph { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 0.85rem; color: var(--muted2); text-align: center; }
    .seller-ph .s-icon { font-size: 2.5rem; opacity: 0.35; }
    .seller-ph h3 { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .seller-ph p { font-size: 0.8rem; max-width: 300px; line-height: 1.6; }
    .seller-ph .todo { font-family: var(--font-m); font-size: 0.62rem; letter-spacing: 0.1em; border: 1px dashed var(--border); padding: 0.22rem 0.6rem; border-radius: 2px; color: var(--muted); }

    /* ════ RESPONSIVE ════ */
    @media (max-width: 900px) {
      #shell { grid-template-columns: var(--sidebar-w) 1fr; }
      #sidebar-right { display: none; }
    }
    @media (max-width: 640px) {
      :root { --header-h: 48px; }
      #shell { grid-template-columns: 1fr; }
      #sidebar-left { display: none; }
      .h-search { display: none; }
      .btn-intro { display: none; }
      .btn-ham { display: block; }
      #tab-nav { overflow-x: auto; flex-wrap: nowrap; padding: 0.45rem 0.6rem; }
      #tab-nav::-webkit-scrollbar { height: 2px; }
      #main-content { padding: 1rem 0.85rem; }
      .h-logo { font-size: 0.92rem; }
    }
  </style>
</head>

<script>
'use strict';

/* ─────────────────────────────────────
   CONSTANTS
───────────────────────────────────── */
const YOUTUBE_CHANNEL_URL = "https://youtube.com/@yourchannel"; // TODO: update URL

/* ─────────────────────────────────────
   MODE SYSTEM
   Add { id:"seller", label:"Seller Portal" } to enable seller tab.
   Then call renderSellerShell() from switchMode().
───────────────────────────────────── */
let MODE = "buyer";
const MODES = [
  { id: "buyer", label: "Buyer Mode" },
  // TODO: { id: "seller", label: "Seller Portal" },
];

/* ─────────────────────────────────────
   PAGES REGISTRY
   name    → matches tpl-{name} template id
   file    → used as fallback href / fetch target
   section → "products" | "legal"
   icon    → display symbol
───────────────────────────────────── */
const PAGES = [
  { name: "overview",   label: "Overview",       file: "overview.html",   section: "products", icon: "◈" },
  { name: "compare",    label: "Compare",         file: "compare.html",    section: "products", icon: "⇄" },
  { name: "trending",   label: "Trending",        file: "trending.html",   section: "products", icon: "↑" },
  { name: "watchlist",  label: "Watchlist",       file: "watchlist.html",  section: "products", icon: "☆" },
  { name: "terms",      label: "Terms",           file: "terms.html",      section: "legal",    icon: "§" },
  { name: "privacy",    label: "Privacy Policy",  file: "privacy.html",    section: "legal",    icon: "⬡" },
  { name: "conditions", label: "Conditions",      file: "conditions.html", section: "legal",    icon: "⊞" },
  { name: "rules",      label: "Rules",           file: "rules.html",      section: "legal",    icon: "▤" },
  // TODO: Seller pages:
  // { name: "dashboard", label: "Dashboard", file: "seller/dashboard.html", section: "seller", icon: "⊡" },
];

/* ─────────────────────────────────────
   PRODUCTS DATA  ← edit freely
───────────────────────────────────── */
const PRODUCTS = [
  {
    id: "phones", label: "Phones", icon: "📱",
    items: [
      { id: "iphone-16",  label: "iPhone 16 Pro" },
      { id: "pixel-9",    label: "Pixel 9 Pro" },
      { id: "s25-ultra",  label: "Galaxy S25 Ultra" },
      { id: "oneplus-13", label: "OnePlus 13" },
    ],
  },
  {
    id: "laptops", label: "Laptops", icon: "💻",
    items: [
      { id: "mbp-m4",      label: "MacBook Pro M4" },
      { id: "thinkpad-x1", label: "ThinkPad X1 Carbon" },
      { id: "dell-xps15",  label: "Dell XPS 15" },
      { id: "lg-gram",     label: "LG Gram 16" },
    ],
  },
  {
    id: "earbuds", label: "Earbuds", icon: "🎧",
    items: [
      { id: "airpods-pro", label: "AirPods Pro 2" },
      { id: "buds3-pro",   label: "Galaxy Buds3 Pro" },
      { id: "bose-qc",     label: "Bose QC Ultra" },
      { id: "wf1000xm6",   label: "Sony WF-1000XM6" },
    ],
  },
  {
    id: "monitors", label: "Monitors", icon: "🖥️",
    items: [
      { id: "lg-ultrafine", label: "LG UltraFine 5K" },
      { id: "dell-u2723d",  label: "Dell UltraSharp 27" },
      { id: "lg-oled",      label: "LG OLED 27 4K" },
    ],
  },
];

/* ─────────────────────────────────────
   STATE
───────────────────────────────────── */
let activePageName  = null;
let activeProductId = null;
let isLoading       = false;

/* ─────────────────────────────────────
   ROUTING
───────────────────────────────────── */
function registerRoutes() {
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

function handleRoute() {
  const hash = window.location.hash;
  if (hash.startsWith('#page=')) {
    const key  = hash.slice(6);
    const page = PAGES.find(p => p.file === key || p.name === key);
    if (page) { loadPage(page.name, false); return; }
  }
  renderHomePage();
}

/* ─────────────────────────────────────
   SHELL
───────────────────────────────────── */
function renderShell() {
  document.getElementById('ytBtn').href = YOUTUBE_CHANNEL_URL;
  renderModeTabs();
  renderSidebar();
  renderSubpageNav();
  renderRightSidebar();
  renderDrawer();
}

/* ─────────────────────────────────────
   MODE TABS
───────────────────────────────────── */
function renderModeTabs() {
  document.getElementById('modeTabs').innerHTML = MODES.map(m =>
    `<button class="mode-tab ${m.id === MODE ? 'active' : ''}" onclick="switchMode('${m.id}')">${escH(m.label)}</button>`
  ).join('');
}

function switchMode(mode) {
  MODE = mode;
  renderModeTabs();
  if (mode === 'buyer') renderHomePage();
  else renderSellerPlaceholder();
}

/* ─────────────────────────────────────
   LEFT SIDEBAR
───────────────────────────────────── */
function renderSidebar() {
  const open = getOpenCats();
  document.getElementById('sidebar-left').innerHTML = `
    <div class="sb-label">MY PRODUCTS <span class="sb-collapse" onclick="collapseAll()" title="Collapse">−</span></div>
    <div class="sb-section">${PRODUCTS.map(c => renderCat(c, open)).join('')}</div>
  `;
}

function renderCat(cat, open) {
  const isOpen = open.includes(cat.id);
  return `
    <div>
      <div class="cat-head" onclick="toggleCat('${cat.id}')">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${escH(cat.label)}</span>
        <span class="cat-arrow ${isOpen ? 'open' : ''}">▶</span>
      </div>
      <div class="cat-items ${isOpen ? 'open' : ''}">
        ${cat.items.map(item => `
          <div class="prod-item ${item.id === activeProductId ? 'active' : ''}"
               onclick="selectProduct('${cat.id}','${item.id}','${escH(item.label)}')">
            <span class="prod-dot"></span>${escH(item.label)}
          </div>`).join('')}
      </div>
    </div>`;
}

function getOpenCats() {
  try { return JSON.parse(sessionStorage.getItem('openCats') || '["phones"]'); }
  catch(e) { return ["phones"]; }
}
function toggleCat(id) {
  let o = getOpenCats();
  o = o.includes(id) ? o.filter(x => x !== id) : [...o, id];
  sessionStorage.setItem('openCats', JSON.stringify(o));
  renderSidebar();
}
function collapseAll() { sessionStorage.setItem('openCats', '[]'); renderSidebar(); }

function selectProduct(catId, itemId, label) {
  activeProductId = itemId;
  activePageName  = null;
  setActive(null);
  closeDrawer();
  document.getElementById('main-content').innerHTML = `
    <div class="pc">
      <span class="pill">${escH(catId.toUpperCase())} · PRODUCT</span>
      <h1>${escH(label)}</h1>
      <p class="meta">SELECT A VIEW TAB ABOVE TO SEE STRUCTURED DATA</p>
      <p>Product detail panel for <strong>${escH(label)}</strong>. Use the tabs above — <strong>Compare</strong>, <strong>Trending</strong>, etc. — to explore structured data, or click another product in the panel.</p>
      <p style="font-family:var(--font-m);font-size:0.68rem;color:var(--muted);margin-top:1.5rem">
        TODO: Connect product ID <code style="color:var(--orange)">${escH(itemId)}</code> to a live data source.
      </p>
    </div>`;
}

/* ─────────────────────────────────────
   SUBPAGE NAV TABS
───────────────────────────────────── */
function renderSubpageNav() {
  document.getElementById('tab-nav').innerHTML = PAGES
    .filter(p => p.section === 'products')
    .map(p => `<button class="page-tab ${activePageName === p.name ? 'active' : ''}" onclick="loadPage('${p.name}')"><span class="tab-ic">${p.icon}</span>${escH(p.label)}</button>`)
    .join('');
}

/* ─────────────────────────────────────
   RIGHT SIDEBAR
───────────────────────────────────── */
function renderRightSidebar() {
  document.getElementById('sidebar-right').innerHTML =
    `<div class="sb-label" style="padding:.65rem .7rem;border-bottom:1px solid var(--border2)">LEGAL</div>` +
    PAGES.filter(p => p.section === 'legal').map(p =>
      `<div class="legal-item ${activePageName === p.name ? 'active' : ''}" onclick="loadPage('${p.name}')">
         <span class="li-ic">${p.icon}</span>${escH(p.label)}
       </div>`
    ).join('');
}

/* ─────────────────────────────────────
   MOBILE DRAWER
───────────────────────────────────── */
function renderDrawer() {
  let html = '';

  html += `<div class="drawer-label">VIEWS</div><div class="drawer-section">`;
  PAGES.filter(p => p.section === 'products').forEach(p => {
    html += `<div class="drawer-item ${activePageName === p.name ? 'active' : ''}" onclick="loadPage('${p.name}');closeDrawer()">${p.icon} ${escH(p.label)}</div>`;
  });
  html += '</div>';

  html += `<div class="drawer-label">LEGAL</div><div class="drawer-section">`;
  PAGES.filter(p => p.section === 'legal').forEach(p => {
    html += `<div class="drawer-item ${activePageName === p.name ? 'active' : ''}" onclick="loadPage('${p.name}');closeDrawer()">${p.icon} ${escH(p.label)}</div>`;
  });
  html += '</div>';

  html += `<div class="drawer-label">MY PRODUCTS</div><div class="drawer-section">`;
  PRODUCTS.forEach(cat => {
    cat.items.forEach(item => {
      html += `<div class="drawer-item ${item.id === activeProductId ? 'active' : ''}" onclick="selectProduct('${cat.id}','${item.id}','${escH(item.label)}')">${cat.icon} ${escH(item.label)}</div>`;
    });
  });
  html += '</div>';

  html += `<div class="drawer-label">NAVIGATE</div><div class="drawer-section">
    <div class="drawer-item" onclick="window.location.href='intro.html'">← Back to Intro</div>
    <div class="drawer-item" onclick="renderHomePage();closeDrawer()">⌂ Home</div>
  </div>`;

  document.getElementById('drawer-inner').innerHTML = html;
}

function openDrawer()  { renderDrawer(); document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }

/* ─────────────────────────────────────
   LOAD PAGE
   Strategy: template-first (zero network dependency).
   1. Check for embedded <template id="tpl-{name}">
   2. Found → render instantly (works offline + file://)
   3. Not found → try fetch() for server environments
   4. Fetch fails → friendly error, no infinite loop
───────────────────────────────────── */
function loadPage(pageName, pushHistory = true) {
  if (isLoading) return;
  const page = PAGES.find(p => p.name === pageName);
  if (!page) { showError('Unknown page', pageName, null); return; }
  if (pageName === activePageName) return; // already showing this page

  isLoading = true;
  activePageName  = pageName;
  activeProductId = null;

  if (pushHistory) history.replaceState(null, '', `#page=${page.file}`);

  setActive(pageName);
  closeDrawer();

  // ── 1. Try embedded template (always works, zero network) ──
  const tpl = document.getElementById(`tpl-${pageName}`);
  if (tpl) {
    isLoading = false;
    const clone = document.importNode(tpl.content, true);
    const wrap  = document.createElement('div');
    wrap.appendChild(clone);
    injectContent(wrap.innerHTML);
    return;
  }

  // ── 2. No template: try fetch (for server environments) ──
  showLoading();
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  fetch(page.file, { signal: ctrl.signal })
    .finally(() => clearTimeout(timer))
    .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
    .then(text => { isLoading = false; injectContent(extractBody(text)); })
    .catch(err => { isLoading = false; showError(page.label, page.file, err); });
}

function extractBody(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return (doc.querySelector('main') || doc.querySelector('.pc') || doc.querySelector('body') || { innerHTML: html }).innerHTML;
}

function injectContent(html) {
  const el = document.getElementById('main-content');
  el.innerHTML = html;
  el.scrollTop = 0;
}

/* ─────────────────────────────────────
   ACTIVE STATE
───────────────────────────────────── */
function setActive(pageName) {
  activePageName = pageName;
  renderSubpageNav();
  renderRightSidebar();
  renderSidebar();
}

/* ─────────────────────────────────────
   UI STATES
───────────────────────────────────── */
function showLoading() {
  document.getElementById('main-content').innerHTML =
    `<div class="loading-box"><div class="spinner"></div><span style="font-family:var(--font-m);font-size:.72rem;letter-spacing:.1em;color:var(--muted)">LOADING…</span></div>`;
}

function showError(label, file, err) {
  document.getElementById('main-content').innerHTML = `
    <div style="max-width:460px;margin:2rem auto;display:flex;flex-direction:column;gap:.85rem">
      <span style="font-family:var(--font-m);font-size:.65rem;color:#f55;border:1px solid rgba(255,85,85,.3);padding:.22rem .6rem;border-radius:2px;width:fit-content">ERROR · LOAD FAILED</span>
      <h2 style="font-size:1.3rem;font-weight:800">${escH(label)}</h2>
      <p style="font-size:.84rem;color:var(--muted2);line-height:1.6">The page could not be loaded.</p>
      ${err ? `<code style="font-family:var(--font-m);font-size:.72rem;color:var(--muted)">${escH(String(err))}</code>` : ''}
      <a href="${escH(file)}" target="_blank" rel="noopener"
         style="display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-m);font-size:.73rem;color:var(--orange);border:1px solid var(--orange-dim);padding:.42rem .9rem;border-radius:2px;text-decoration:none;width:fit-content">
        Open Raw File ↗
      </a>
    </div>`;
}

function renderHomePage() {
  activePageName  = null;
  activeProductId = null;
  history.replaceState(null, '', window.location.pathname);
  setActive(null);

  const productPages = PAGES.filter(p => p.section === 'products');
  const legalPages   = PAGES.filter(p => p.section === 'legal');

  document.getElementById('main-content').innerHTML = `
    <div class="home-wrap">
      <h2>Welcome to <span>VIA Decide</span></h2>
      <p class="home-sub">// SELECT A VIEW OR BROWSE PRODUCTS IN THE PANEL · TAP ☰ ON MOBILE</p>
      <div class="card-grid">
        ${productPages.map(p => `
          <div class="card" onclick="loadPage('${p.name}')">
            <div class="card-ic">${p.icon}</div>
            <div class="card-t">${escH(p.label)}</div>
            <div class="card-d">Open the ${escH(p.label.toLowerCase())} view</div>
          </div>`).join('')}
      </div>
      <div style="border-top:1px solid var(--border);padding-top:.85rem">
        <p style="font-family:var(--font-m);font-size:.63rem;color:var(--muted);letter-spacing:.1em;margin-bottom:.6rem">LEGAL</p>
        <div style="display:flex;flex-wrap:wrap;gap:.4rem">
          ${legalPages.map(p => `
            <button onclick="loadPage('${p.name}')"
                    style="font-family:var(--font-m);font-size:.7rem;padding:.28rem .65rem;border:1px solid var(--border);border-radius:2px;background:transparent;color:var(--muted2);cursor:pointer;transition:var(--ease)"
                    onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted2)'">
              ${p.icon} ${escH(p.label)}
            </button>`).join('')}
        </div>
      </div>
    </div>`;
}

/* ─────────────────────────────────────
   SEARCH — client-side filter
───────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  if (!q) { renderSidebar(); return; }
  const results = [];
  PRODUCTS.forEach(cat => cat.items.forEach(item => {
    if (item.label.toLowerCase().includes(q)) results.push({ cat, item });
  }));
  const sb = document.getElementById('sidebar-left');
  if (!results.length) {
    sb.innerHTML = `<div class="sb-label">SEARCH</div><p style="padding:.75rem;font-size:.76rem;color:var(--muted)">No results for "${escH(q)}"</p>`;
    return;
  }
  sb.innerHTML = `
    <div class="sb-label">RESULTS <span style="color:var(--orange)">${results.length}</span></div>
    <div class="sb-section">
      ${results.map(r => `
        <div class="prod-item ${r.item.id === activeProductId ? 'active' : ''}"
             onclick="selectProduct('${r.cat.id}','${r.item.id}','${escH(r.item.label)}')">
          <span class="prod-dot"></span>${escH(r.item.label)}
          <span style="margin-left:auto;font-size:.7rem">${r.cat.icon}</span>
        </div>`).join('')}
    </div>`;
});

/* ─────────────────────────────────────
   UTILS
───────────────────────────────────── */
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ─────────────────────────────────────
   BOOT
───────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  registerRoutes();
});
</script>
