<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIA Decide — Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #14141a;
      --surface2: #1c1c24;
      --border: #252530;
      --border2: #1e1e28;
      --orange: #ff6b2b;
      --orange-dim: rgba(255,107,43,0.15);
      --orange-glow: rgba(255,107,43,0.3);
      --text: #e8e8f0;
      --muted: #5a5a70;
      --muted2: #8080a0;
      --sidebar-w: 230px;
      --right-w: 190px;
      --header-h: 52px;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius: 4px;
      --transition: 0.18s ease;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      overflow: hidden;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ══════════════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════════════ */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 1rem;
      z-index: 100;
    }

    .header-logo {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }
    .header-logo span { color: var(--orange); }

    .header-mode-tabs {
      display: flex;
      gap: 2px;
      margin-left: 0.5rem;
    }
    .mode-tab {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      transition: var(--transition);
      border-radius: 2px;
    }
    .mode-tab.active {
      background: var(--orange-dim);
      border-color: var(--orange);
      color: var(--orange);
    }
    .mode-tab:hover:not(.active) { background: var(--surface2); color: var(--text); }

    .header-spacer { flex: 1; }

    .header-search {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.3rem 0.7rem;
    }
    .header-search input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      width: 160px;
    }
    .header-search input::placeholder { color: var(--muted); }
    .search-icon { color: var(--muted); font-size: 0.85rem; }

    .btn-yt {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted2);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      text-decoration: none;
      border-radius: 2px;
      white-space: nowrap;
      transition: var(--transition);
    }
    .btn-yt:hover { border-color: #ff0000; color: #ff4444; background: rgba(255,0,0,0.06); }
    .btn-yt .yt-icon { color: #ff4444; }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--muted2);
      text-decoration: none;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      transition: var(--transition);
    }
    .btn-back:hover { color: var(--text); border-color: var(--muted2); }

    /* ══════════════════════════════════════════════════
       LAYOUT
    ══════════════════════════════════════════════════ */
    #shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--right-w);
      grid-template-rows: 1fr;
      height: 100vh;
      padding-top: var(--header-h);
    }

    /* ── LEFT SIDEBAR ── */
    #sidebar-left {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section {
      padding: 0.75rem 0.75rem 0.25rem;
    }
    .sidebar-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      padding: 0.4rem 0.25rem 0.5rem;
      border-bottom: 1px solid var(--border2);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-category {
      margin-bottom: 0.5rem;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: var(--transition);
      user-select: none;
    }
    .category-header:hover { background: var(--surface2); }
    .category-icon { font-size: 0.9rem; }
    .category-name {
      font-size: 0.8rem;
      font-weight: 600;
      flex: 1;
    }
    .category-toggle {
      font-size: 0.65rem;
      color: var(--muted);
      transition: transform 0.2s;
    }
    .category-toggle.open { transform: rotate(90deg); }

    .category-items {
      padding-left: 0.5rem;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease;
    }
    .category-items.open { max-height: 500px; }

    .product-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--muted2);
      transition: var(--transition);
      text-decoration: none;
    }
    .product-item:hover { background: var(--surface2); color: var(--text); }
    .product-item.active { background: var(--orange-dim); color: var(--orange); }
    .product-item .item-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── MAIN CONTENT ── */
    #main-wrap {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #subpage-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .subpage-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .subpage-tab:hover { background: var(--surface2); color: var(--text); }
    .subpage-tab.active {
      background: var(--orange-dim);
      border-color: var(--orange);
      color: var(--orange);
    }
    .subpage-tab .tab-icon { font-size: 0.85rem; }

    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }

    /* ── RIGHT SIDEBAR ── */
    #sidebar-right {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 0;
    }

    .legal-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.75rem;
      font-size: 0.78rem;
      color: var(--muted2);
      cursor: pointer;
      border-bottom: 1px solid var(--border2);
      transition: var(--transition);
    }
    .legal-item:hover { background: var(--surface2); color: var(--text); }
    .legal-item.active { background: var(--orange-dim); color: var(--orange); border-left: 2px solid var(--orange); }
    .legal-icon { font-size: 0.85rem; }

    /* ── CONTENT STATES ── */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 300px;
      gap: 1rem;
      color: var(--muted2);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 460px;
      margin: 2rem auto;
    }
    .error-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: #ff4444;
      border: 1px solid rgba(255,68,68,0.3);
      padding: 0.25rem 0.65rem;
      border-radius: 2px;
      width: fit-content;
    }
    .error-title { font-size: 1.3rem; font-weight: 700; }
    .error-msg { font-size: 0.85rem; color: var(--muted2); line-height: 1.6; }
    .btn-rawlink {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--orange);
      border: 1px solid var(--orange-dim);
      padding: 0.45rem 1rem;
      border-radius: 2px;
      text-decoration: none;
      width: fit-content;
      transition: var(--transition);
    }
    .btn-rawlink:hover { background: var(--orange-dim); }

    .home-state {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem 0;
    }
    .home-state h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .home-state h2 span { color: var(--orange); }
    .home-state .sub {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted2);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .card:hover {
      border-color: var(--orange);
      background: var(--orange-dim);
    }
    .card-icon { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .card-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.25rem; }
    .card-desc { font-size: 0.75rem; color: var(--muted2); line-height: 1.5; }

    /* ── INJECTED PAGE CONTENT ── */
    .page-content { max-width: 720px; }
    .page-content h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; }
    .page-content h2 { font-size: 1.15rem; font-weight: 700; margin: 1.5rem 0 0.5rem; color: var(--muted2); border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    .page-content p { font-size: 0.88rem; line-height: 1.75; color: #a0a0b8; margin-bottom: 0.75rem; }
    .page-content .meta { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 1.5rem; }
    .page-content ul { margin: 0.5rem 0 0.75rem 1.5rem; }
    .page-content li { font-size: 0.88rem; line-height: 1.75; color: #a0a0b8; }

    /* ── SELLER PLACEHOLDER ── (TODO: expand this section) */
    .seller-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 300px;
      gap: 1rem;
      color: var(--muted2);
      text-align: center;
    }
    .seller-placeholder .icon { font-size: 3rem; opacity: 0.4; }
    .seller-placeholder h3 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .seller-placeholder p { font-size: 0.82rem; max-width: 320px; line-height: 1.6; }
    .seller-placeholder .todo-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      border: 1px dashed var(--border);
      padding: 0.25rem 0.7rem;
      border-radius: 2px;
      color: var(--muted);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      #shell { grid-template-columns: var(--sidebar-w) 1fr; }
      #sidebar-right { display: none; }
    }
    @media (max-width: 620px) {
      #shell { grid-template-columns: 1fr; }
      #sidebar-left { display: none; }
      .header-search { display: none; }
    }
    @media (max-width: 400px) {
      .btn-yt span { display: none; }
    }
  </style>
</head>
<body>

function registerRoutes() {
  window.addEventListener('hashchange', handleRoute);

}

function handleRoute() {
  const hash = window.location.hash; // e.g. #page=terms.html
  if (hash.startsWith('#page=')) {
    const fileName = hash.slice(6);
    const page = PAGES.find(p => p.file === fileName || p.name === fileName);
    if (page) {
      loadPage(page.name, false); // false = don't push history again
      return;
    }
  }
  renderHomePage();
}

/* ──────────────────────────────────────────────────────────
   LOAD PAGE — fetch with template fallback
────────────────────────────────────────────────────────── */
async function loadPage(pageName, pushHistory = true) {
  if (isLoading) return;

  const page = PAGES.find(p => p.name === pageName);
  if (!page) {
    showError('Page not found', pageName, null);
    return;
  }

  isLoading = true;
  activePageName = pageName;
  activeProductId = null;

  if (pushHistory) {
    window.location.hash = `page=${page.file}`;
  }

  setActive(pageName);
  showLoading();

  let html = null;

  try {
    const res = await fetchWithTimeout(page.file, 6000);
    if (res.ok) {
      const text = await res.text();
      // Extract body content (or use full text if simple fragment)
      html = extractPageContent(text);
    } else {
      throw new Error(`HTTP ${res.status}`);
    }
  } catch (err) {
    // Fallback: try embedded template
    const tpl = document.getElementById(`tpl-${pageName}`);
    if (tpl) {
      html = tpl.innerHTML;
    } else {
      isLoading = false;
      showError(page.label, page.file, err);
      return;
    }
  }

  isLoading = false;
  injectContent(html);
}

function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

function extractPageContent(html) {
  // If it's a full HTML doc, try to pull <main> or <body> inner, else return as-is
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const main = doc.querySelector('main') || doc.querySelector('.page-content');
  if (main) return main.innerHTML;
  const body = doc.querySelector('body');
  if (body) return body.innerHTML;
  return html;
}

function injectContent(html) {
  const content = document.getElementById('main-content');
  content.innerHTML = html;
  content.scrollTop = 0;
}

/* ──────────────────────────────────────────────────────────
   SEARCH (basic client-side filter)
────────────────────────────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { renderSidebar(); return; }

  const sidebar = document.getElementById('sidebar-left');
  const results = [];
  PRODUCTS.forEach(cat => {
    cat.items.forEach(item => {
      if (item.label.toLowerCase().includes(q)) {
        results.push({ cat, item });
      }
    });
  });

  if (results.length === 0) {
    sidebar.innerHTML = `
      <div class="sidebar-section">
        <div class="sidebar-label">SEARCH RESULTS</div>
        <p style="padding:0.75rem;font-size:0.78rem;color:var(--muted)">No products match "${escHtml(q)}"</p>
      </div>
    `;
    return;
  }

  sidebar.innerHTML = `
    <div class="sidebar-section">
      <div class="sidebar-label">SEARCH RESULTS <span style="color:var(--orange)">${results.length}</span></div>
      ${results.map(r => `
        <a class="product-item" onclick="selectProduct('${r.cat.id}', '${r.item.id}', '${escHtml(r.item.label)}')" href="javascript:void(0)">
          <span class="item-dot"></span>
          ${escHtml(r.item.label)}
          <span style="margin-left:auto;font-size:0.7rem;color:var(--muted)">${r.cat.icon}</span>
        </a>
      `).join('')}
    </div>
  `;
});

/* ──────────────────────────────────────────────────────────
   UTILS
────────────────────────────────────────────────────────── */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
