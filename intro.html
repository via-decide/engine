<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIA Decide — Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #252530;
      --orange: #ff6b2b;
      --orange-dim: #c44e18;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      overflow: hidden;
    }

    /* Animated grid background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,107,43,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,107,43,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
    }
    @keyframes gridDrift {
      0% { transform: translate(0,0); }
      100% { transform: translate(60px,60px); }
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* Glow orb */
    .orb {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,107,43,0.18) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    }

    .stage {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--orange);
      border: 1px solid var(--orange-dim);
      padding: 0.35rem 0.9rem;
      border-radius: 2px;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease both;
    }

    .logo {
      font-size: clamp(3.5rem, 10vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 0.4rem;
      animation: fadeUp 0.7s ease 0.1s both;
    }
    .logo span { color: var(--orange); }

    .tagline {
      font-family: var(--font-mono);
      font-weight: 300;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 3.5rem;
      animation: fadeUp 0.7s ease 0.2s both;
    }

    .pitch {
      max-width: 520px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.6;
      color: #b0b0c0;
      margin-bottom: 3rem;
      animation: fadeUp 0.7s ease 0.3s both;
    }
    .pitch strong { color: var(--text); }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--orange);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      padding: 0.9rem 2.2rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      animation: fadeUp 0.7s ease 0.4s both;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(255,107,43,0.4); }
    .cta:hover::before { transform: translateX(100%); }
    .cta:active { transform: translateY(0); }
    .cta .arrow { font-size: 1.2rem; transition: transform 0.2s; }
    .cta:hover .arrow { transform: translateX(4px); }

    .footer-note {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      white-space: nowrap;
      animation: fadeUp 0.7s ease 0.6s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      border-color: var(--border);
      border-style: solid;
      opacity: 0.6;
    }
    .corner-tl { top: 1.5rem; left: 1.5rem; border-width: 1px 0 0 1px; }
    .corner-tr { top: 1.5rem; right: 1.5rem; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 1.5rem; left: 1.5rem; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 1.5rem; right: 1.5rem; border-width: 0 1px 1px 0; }

    @media (max-width: 600px) {
      .corner { display: none; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="noise"></div>
  <div class="orb"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="stage">
    <span class="badge">DECISION ENGINE · v1.0</span>
    <h1 class="logo">VIA<span>.</span>DECIDE</h1>
    <p class="tagline">// ENGINE · PRODUCT INTELLIGENCE PLATFORM</p>
    <p class="pitch">
      <strong>Cut through the noise.</strong> Research, compare, and decide on the products that matter — with structured data and zero marketing fluff.
    </p>
    <a class="cta" href="index.html">
      Enter App <span class="arrow">→</span>
    </a>
  </div>

  <p class="footer-note">NO ADS · NO AFFILIATE BIAS · STRUCTURED INTELLIGENCE</p>
</body>
</html>
